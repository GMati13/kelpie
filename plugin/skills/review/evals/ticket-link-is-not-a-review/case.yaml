schema_version: "1.1"
name: ticket-link-is-not-a-review
expected_outcome: |
  Started as the review dispatcher with a ticket's link and no pull request. It doesn't guess another job (working on the ticket, or finding and reviewing its pull requests on its own): it says it was given a ticket, that /kelpie:review takes pull request links or a file, and asks what the person wants. Nothing is changed.
