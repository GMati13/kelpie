schema_version: "1.1"
name: pull-request-link-is-not-a-ticket
expected_outcome: |
  Started as the ticket dispatcher with a pull request's link instead of a ticket's key and link. It
  doesn't guess another job (reviewing it with the person's acme-review skill, or working on it): it
  says it was given a pull request, that /kelpie:ticket takes a ticket's key and link, and asks what
  the person wants. No file is changed.
context:
