schema_version: "1.1"
name: agent-in-another-profile
expected_outcome: |
  The asker runs in the person's Home profile; the agent they mean is in their Work profile, which Kelpie keeps from it (profiles may run on different Claude accounts). find_agents finds nobody. The reply says that agent isn't reachable from here, as Kelpie keeps each profile's agents to that profile, and offers what the person can do (switch to Work in Kelpie, ask a Claude there). It sends no message (not even to a session its own messaging lists), and reads no Claude, Herdr or session files to find it.
