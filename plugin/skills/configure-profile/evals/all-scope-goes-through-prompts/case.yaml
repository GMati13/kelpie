schema_version: "1.1"
name: all-scope-goes-through-prompts
expected_outcome: |
  Setting a profile up from A to Z, with the connections and story commands already saved. Rather than finishing, it moves on to how the agents get their jobs: it says each job goes to the person's own skill for it, else Kelpie's own routine, with nothing to set up, and asks only whether any job should be done differently. It saves no prompt in this turn, and the person can say it's fine and stop.
