schema_version: "1.1"
name: all-scope-goes-through-prompts
expected_outcome: |
  Setting a profile up from A to Z, with the connections and story commands already saved. Rather than finishing, it moves on to the agents' prompts: it asks the person, in plain questions, how they work (how they start on a ticket, how a pull request gets merged: one repo or several, a deploy or none, who approves) so it can fit the prompts to them. It saves no prompt in this turn, and the person can say the defaults are fine and stop.
