schema_version: "1.1"
name: prompts-defaults-fit-saves-none
expected_outcome: |
  The person's answers need nothing of their own (a plain ticket start, a merge across several repos with a deploy and a roll back, a teammate approving, a review against the ticket): each job already goes as its Kelpie skill, to their own skill for it or Kelpie's routine. It says no prompt is needed and saves none: no save_profile call sets one.
